<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A그룹 멘토링 시간 조율</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://hangeul.pstatic.net/hangeul_static/css/nanum-square-round.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/innks/NanumSquareRound@master/nanumsquareround.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Layout: one column, name picker → weekly grid (paint / overlap) → best-slot list */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5d6b78; --line:#d7dee5;
  --accent:#1f5f8b; --accent-ink:#ffffff; --mine:#2b7bb4;
  --h1:#e3eef6; --h2:#b9d5ea; --h3:#7fb0d6; --h4:#1f5f8b; --h4-ink:#ffffff;
  --ok:#1d7a4f; --warn:#9a5b12;
  --font-body:"NanumSquareRound", "NanumSquareRoundR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161c; --surface:#18202a; --ink:#e6edf3; --muted:#93a3b2; --line:#2b3644;
  --accent:#6fb3e6; --accent-ink:#0c1520; --mine:#5aa6e0;
  --h1:#1b2b3a; --h2:#21435f; --h3:#2f6a96; --h4:#6fb3e6; --h4-ink:#0c1520;
  --ok:#5cc792; --warn:#e0a85a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#18202a; --ink:#e6edf3; --muted:#93a3b2; --line:#2b3644;
  --accent:#6fb3e6; --accent-ink:#0c1520; --mine:#5aa6e0;
  --h1:#1b2b3a; --h2:#21435f; --h3:#2f6a96; --h4:#6fb3e6; --h4-ink:#0c1520;
  --ok:#5cc792; --warn:#e0a85a; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:600}
h1{font-size:26px;line-height:1.25;margin:0;text-wrap:balance;font-weight:700}
.lede{margin:0;color:var(--muted);max-width:60ch}
h2{font-size:15px;margin:0;font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.people{display:flex;flex-wrap:wrap;gap:8px}
.person{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.person[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.person .role{font-size:12px;opacity:.75}
.person .dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
.person .dot.done{background:var(--ok)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;align-self:flex-start}
.tabs button{font:inherit;font-size:14px;border:0;background:transparent;color:var(--muted);padding:7px 14px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.hint{font-size:13px;color:var(--muted);margin:0}
.status{font-size:13px;color:var(--muted);min-height:1.4em}
.status.ok{color:var(--ok)} .status.warn{color:var(--warn)}
.gridbox{overflow-x:auto}
.grid{display:grid;grid-template-columns:46px repeat(7,minmax(38px,1fr));gap:3px;user-select:none;-webkit-user-select:none;touch-action:none;min-width:320px}
.grid .dh{text-align:center;font-size:13px;font-weight:600;padding-bottom:4px}
.grid .dh.we{color:var(--muted)}
.grid .th{font-family:var(--font-mono);font-size:11px;color:var(--muted);text-align:right;padding-right:6px;line-height:30px}
.cell{height:30px;border-radius:4px;background:var(--bg);border:1px solid var(--line);font-family:var(--font-mono);font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer}
.mode-edit .cell.mine{background:var(--mine);border-color:var(--mine)}
.mode-view .cell{cursor:pointer}
.cell.c1{background:var(--h1)} .cell.c2{background:var(--h2)} .cell.c3{background:var(--h3)}
.cell.c4{background:var(--h4);color:var(--h4-ink);border-color:var(--h4)}
.cell.sel{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:14px;border-radius:3px;border:1px solid var(--line);display:inline-block}
.detail{font-size:14px;margin:0;min-height:1.5em}
.best{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.best li{display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-bottom:1px solid var(--line);padding:8px 2px;flex-wrap:wrap}
.best .when{font-weight:600;font-variant-numeric:tabular-nums}
.best .who{font-size:13px;color:var(--muted)}
.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--h1);color:var(--ink)}
.pill.all{background:var(--ok);color:var(--surface)}
.empty{color:var(--muted);font-size:14px;margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.ghost{font:inherit;font-size:13px;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:5px 10px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">IT 테크 트랙 · A그룹 · 4주 소그룹 코칭</div>
    <h1>멘토링 가능 시간을 칠해 주세요</h1>
    <p class="lede">매주 고정으로 만날 시간을 정합니다. 이름을 고르고, 매주 참석 가능한 1시간 칸을 눌러 칠하면 자동 저장됩니다. 모두 가능한 시간은 아래 목록에 바로 나타납니다.</p>
  </header>

  <section class="panel" aria-labelledby="who-h">
    <h2 id="who-h">1. 내 이름 선택</h2>
    <div class="people" id="people"></div>
  </section>

  <section class="panel" aria-labelledby="grid-h">
    <div class="row">
      <h2 id="grid-h">2. 주간 가능 시간</h2>
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-edit" aria-selected="true">내 시간 칠하기</button>
        <button role="tab" id="tab-view" aria-selected="false">전체 겹침 보기</button>
      </div>
    </div>
    <p class="hint" id="hint">칸을 누르거나 끌어서 칠하세요. 칠한 칸을 다시 누르면 지워집니다.</p>
    <div class="gridbox"><div class="grid mode-edit" id="grid" aria-label="요일별 시간표"></div></div>
    <div class="legend" id="legend" hidden>
      <span><i style="background:var(--h1)"></i>1명</span><span><i style="background:var(--h2)"></i>2명</span><span><i style="background:var(--h3)"></i>3명</span><span><i style="background:var(--h4)"></i>4명 (전원)</span>
    </div>
    <p class="detail" id="detail" hidden></p>
    <div class="row">
      <div class="status" id="status" role="status">시간표를 불러오는 중입니다.</div>
      <button class="ghost" id="clear" hidden>내 선택 모두 지우기</button>
    </div>
  </section>

  <section class="panel" aria-labelledby="best-h">
    <h2 id="best-h">3. 추천 시간</h2>
    <ul class="best" id="best"></ul>
  </section>
</div>
<script>

const PEOPLE=[
  {key:"mentor",name:"멘토",role:"코치"},
  {key:"yuri",name:"최유리",role:"서버 개발"},
  {key:"yunsu",name:"손윤수",role:"QA"},
  {key:"hyunggyu",name:"최형규",role:"데이터 분석"}
];
const DAYS=["월","화","수","목","금","토","일"];
const HOURS=[];for(let h=9;h<=22;h++)HOURS.push(h);
const pad=n=>String(n).padStart(2,"0");
const label=(d,h)=>`${DAYS[d]}요일 ${pad(h)}:00–${pad(h+1)}:00`;

let me=null,mode="edit",all={},mySet=new Set(),online=false,selSlot=null;
try{me=localStorage.getItem("mentor-who")}catch(e){}
if(!PEOPLE.some(p=>p.key===me))me=null;

const $=id=>document.getElementById(id);
const grid=$("grid"),statusEl=$("status");
function setStatus(t,cls){statusEl.textContent=t;statusEl.className="status"+(cls?" "+cls:"")}

function renderPeople(){
  const box=$("people");box.textContent="";
  PEOPLE.forEach(p=>{
    const b=document.createElement("button");b.className="person";b.type="button";
    b.setAttribute("aria-pressed",String(p.key===me));
    const dot=document.createElement("span");dot.className="dot"+((all[p.key]||[]).length?" done":"");
    dot.title=(all[p.key]||[]).length?"입력 완료":"아직 입력 전";
    const n=document.createElement("span");n.textContent=p.name;
    const r=document.createElement("span");r.className="role";r.textContent=p.role;
    b.append(dot,n,r);
    b.onclick=()=>{me=p.key;try{localStorage.setItem("mentor-who",me)}catch(e){}mySet=new Set(all[me]||[]);setMode("edit");renderAll()};
    box.appendChild(b);
  });
}

const cells={};
function buildGrid(){
  grid.appendChild(document.createElement("div"));
  DAYS.forEach((d,i)=>{const e=document.createElement("div");e.className="dh"+(i>4?" we":"");e.textContent=d;grid.appendChild(e)});
  HOURS.forEach(h=>{
    const t=document.createElement("div");t.className="th";t.textContent=pad(h)+":00";grid.appendChild(t);
    DAYS.forEach((_,d)=>{
      const c=document.createElement("div");c.className="cell";c.dataset.slot=d+"-"+h;
      c.setAttribute("role","button");c.tabIndex=0;c.setAttribute("aria-label",label(d,h));
      cells[d+"-"+h]=c;grid.appendChild(c);
    });
  });
}

function counts(){
  const m={};PEOPLE.forEach(p=>{const s=p.key===me?[...mySet]:(all[p.key]||[]);s.forEach(k=>{(m[k]=m[k]||[]).push(p.name)})});return m;
}

function renderGrid(){
  grid.className="grid mode-"+mode;
  const m=counts();
  for(const k in cells){
    const c=cells[k];c.className="cell";c.textContent="";
    if(mode==="edit"){if(mySet.has(k))c.classList.add("mine");c.setAttribute("aria-pressed",String(mySet.has(k)))}
    else{c.removeAttribute("aria-pressed");const n=(m[k]||[]).length;if(n){c.classList.add("c"+Math.min(n,4));c.textContent=n}if(k===selSlot)c.classList.add("sel")}
  }
  $("legend").hidden=mode!=="view";$("detail").hidden=mode!=="view";
  $("clear").hidden=!(mode==="edit"&&me&&mySet.size);
  $("hint").textContent=mode==="edit"
    ?(me?"칸을 누르거나 끌어서 칠하세요. 칠한 칸을 다시 누르면 지워집니다.":"먼저 위에서 이름을 골라 주세요.")
    :"숫자는 가능한 인원입니다. 칸을 누르면 누가 가능한지 보입니다.";
  if(mode==="view"){
    const d=$("detail");
    if(selSlot){const[dd,hh]=selSlot.split("-").map(Number);const names=m[selSlot]||[];
      d.textContent=label(dd,hh)+" · "+(names.length?names.join(", ")+" 가능":"가능한 사람이 없습니다");}
    else d.textContent="칸을 눌러 가능한 사람을 확인하세요.";
  }
}

function renderBest(){
  const ul=$("best");ul.textContent="";
  const m=counts();
  const responded=PEOPLE.filter(p=>(p.key===me?mySet.size:(all[p.key]||[]).length)>0);
  if(!responded.length){const li=document.createElement("p");li.className="empty";li.textContent="아직 입력한 사람이 없습니다. 네 명이 모두 칠하면 전원 가능한 시간이 여기 표시됩니다.";ul.appendChild(li);return}
  const list=Object.entries(m).map(([k,names])=>{const[d,h]=k.split("-").map(Number);return{d,h,names}})
    .sort((a,b)=>b.names.length-a.names.length||a.d-b.d||a.h-b.h).slice(0,6);
  const waiting=PEOPLE.filter(p=>!responded.includes(p)).map(p=>p.name);
  list.forEach(s=>{
    const li=document.createElement("li");
    const w=document.createElement("span");w.className="when";w.textContent=label(s.d,s.h);
    const right=document.createElement("span");right.style.display="inline-flex";right.style.gap="8px";right.style.alignItems="baseline";right.style.flexWrap="wrap";
    const who=document.createElement("span");who.className="who";
    const missing=PEOPLE.filter(p=>!s.names.includes(p.name)).map(p=>p.name);
    who.textContent=missing.length?"불가 또는 미입력: "+missing.join(", "):"전원 가능";
    const pill=document.createElement("span");pill.className="pill"+(s.names.length===PEOPLE.length?" all":"");pill.textContent=s.names.length+"/"+PEOPLE.length+"명";
    right.append(who,pill);li.append(w,right);ul.appendChild(li);
  });
  if(waiting.length){const p=document.createElement("p");p.className="empty";p.textContent="아직 입력 전: "+waiting.join(", ");ul.appendChild(p)}
}
function renderAll(){renderPeople();renderGrid();renderBest()}

function setMode(m){mode=m;$("tab-edit").setAttribute("aria-selected",String(m==="edit"));$("tab-view").setAttribute("aria-selected",String(m==="view"));renderGrid()}
$("tab-edit").onclick=()=>setMode("edit");
$("tab-view").onclick=()=>setMode("view");

/* painting */
let painting=false,paintVal=true,changed=false;
function paint(k){if(!k)return;const has=mySet.has(k);if(paintVal&&!has){mySet.add(k);changed=true}else if(!paintVal&&has){mySet.delete(k);changed=true}cells[k].classList.toggle("mine",mySet.has(k))}
grid.addEventListener("pointerdown",e=>{
  const c=e.target.closest(".cell");if(!c)return;
  if(mode==="view"){selSlot=c.dataset.slot;renderGrid();return}
  if(!me){setStatus("먼저 위에서 이름을 골라 주세요.","warn");return}
  painting=true;paintVal=!mySet.has(c.dataset.slot);paint(c.dataset.slot);e.preventDefault();
});
grid.addEventListener("pointermove",e=>{if(!painting)return;const el=document.elementFromPoint(e.clientX,e.clientY);const c=el&&el.closest&&el.closest(".cell");if(c)paint(c.dataset.slot)});
window.addEventListener("pointerup",()=>{if(!painting)return;painting=false;if(changed){changed=false;renderGrid();renderBest();scheduleSave()}});
grid.addEventListener("keydown",e=>{
  if(e.key!=="Enter"&&e.key!==" ")return;const c=e.target.closest(".cell");if(!c)return;e.preventDefault();
  if(mode==="view"){selSlot=c.dataset.slot;renderGrid();return}
  if(!me)return;paintVal=!mySet.has(c.dataset.slot);paint(c.dataset.slot);changed=false;renderGrid();renderBest();scheduleSave();
});
$("clear").onclick=()=>{mySet.clear();renderAll();scheduleSave()};

/* saving: one request at a time, coalesced */
let saveTimer=null,saving=false,dirty=false;
function scheduleSave(){dirty=true;setStatus("저장 중…");clearTimeout(saveTimer);saveTimer=setTimeout(flush,700)}
async function flush(){
  if(saving||!dirty)return;saving=true;dirty=false;
  const who=me,slots=[...mySet].sort();
  try{
    const r=await fetch("/api/avail",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({who,slots})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error||r.status);
    all[who]=j.slots||slots;setStatus("저장했습니다.","ok");renderPeople();
  }catch(e){setStatus(String(e.message)==="storage_not_connected"?"저장소가 아직 연결되지 않았습니다. 관리자에게 알려 주세요.":"저장하지 못했습니다. 잠시 후 칸을 다시 눌러 주세요.","warn")}
  saving=false;if(dirty)flush();
}

async function load(first){
  try{
    const r=await fetch("/api/avail",{cache:"no-store"});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error||r.status);
    const next={};
    for(const [k,v] of Object.entries(j.people||{})){if(PEOPLE.some(p=>p.key===k)&&Array.isArray(v))next[k]=v.filter(s=>typeof s==="string"&&cells[s])}
    all=next;
    if(me&&!saving&&!dirty&&!painting)mySet=new Set(all[me]||[]);
    if(first||!online){online=true;setStatus("연결됨. 칠하면 자동 저장됩니다.")}
    renderAll();
  }catch(e){
    online=false;
    setStatus(String(e.message)==="storage_not_connected"?"저장소가 아직 연결되지 않았습니다. Vercel에서 Redis 저장소를 연결해 주세요.":"시간표를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.","warn");
  }
}

buildGrid();
renderAll();
load(true);
setInterval(()=>{if(!document.hidden&&!painting&&!dirty&&!saving)load(false)},15000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load(false)});
</script>
</body>
</html>
